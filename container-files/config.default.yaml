# add this modeline for validation in vscode
yaml-language-server: $schema=https://raw.githubusercontent.com/mostlygeek/llama-swap/refs/heads/main/config-schema.json
#
# !!! See https://github.com/mostlygeek/llama-swap/blob/main/docs/config.example.yaml for a full reference
healthCheckTimeout: 600
logToStdout: "both"
captureBuffer: 100
sendLoadingState: false
globalTTL: 1800

macros:
  "model-url": http://127.0.0.1:${PORT}
# Set kv cache to q8, this is for example purpose, if you have 16GB vram and
# intend to load some of the model examples bellow (qwen3.8-27b) with the context size
# specified, you will need this
# Tune according to your preferences / hardware specs
  "llama": >
    llama-server
    --port ${PORT}
    -lv 4
    -fa on
    -ctk q8_0
    -ctv q8_0
    --load-mode none
  "llama-vulkan": >
   llama-server-vulkan
    --port ${PORT}
    -lv 4
    -fa on
    -ctk q8_0
    -ctv q8_0
    --load-mode none
  "sd": >
    sd-server
    --listen-port ${PORT}
  "sd-vulkan": >
    sd-server-vulkan
    --listen-port ${PORT}
  # Kokoro-FastAPI text-to-speech server (cpu only, no gpu involved)
  "kokoro": >
    kokoro-server --port ${PORT}
  # See readme.md, you need to install Strata manually using their github instruction
  # This can be done fairly easily
  "strata": >
    /root/data/Strata/.venv/bin/python /root/data/Strata/serve/server.py --engine strata --port ${PORT}
  "default_ctx": 32768
  "models_dir": "${env.HOME}/data/models"
  "sd_models_dir": "${models_dir}/sd"
  "default_llama_args": "--ctx-size ${default_ctx} --models_dir ${models_dir}"

models:
  # This model is good for code completion
  "qwen2.5-coder-1.5b-base":
    macros:
      "default_ctx": 3072
    proxy: "${model-url}"
    # Force to run on CPU, since this model is small and fast, this is a viable option.
    # This saves vram for other larger models like gemma 4 or qwen 3.6 to run at the same time
    env:
      - "ROCR_VISIBLE_DEVICES=-1"
    cmd: >
      ${llama}
      ${default_llama_args}
      -ngl 0
      --no-op-offload
      -hf Qwen/Qwen2.5-Coder-1.5B-Instruct-GGUF:Q4_K_M
  # This is a good general purpose and coding model,
  # the newer Qwen3.6 moe A3B (fast and good)
  # UD-IQ3_S is probably the largest you can fit on a 16GB vram gpu with a 32K context
  # The temperature and other options are taken from
  # https://unsloth.ai/docs/models/qwen3.6
  "Qwen3.6-35B-A3B":
    proxy: "${model-url}"
    cmd: >
      ${llama}
      ${default_llama_args}
      --temp 0.6
      --top-p 0.95
      --top-k 20
      --min-p 0.00
      -hf unsloth/Qwen3.6-35B-A3B-GGUF:UD-IQ3_S
  # Of course, gemma 4 A4B moe is the other good one (fast and good)
  # This quant fits on a 16GB vram gpu with 32K context
  # The temperature and other options are taken from
  # https://unsloth.ai/docs/models/gemma-4
  "gemma-4-26B-A4B":
    proxy: "${model-url}"
    cmd: >
      ${llama}
      ${default_llama_args}
      --temp 1.0
      --top-p 0.95
      --top-k 64
      --chat-template-kwargs '{"enable_thinking":true}'
      -hf unsloth/gemma-4-26B-A4B-it-GGUF:UD-IQ4_NL
  "gemma-4-E4B":
    proxy: "${model-url}"
    cmd: >
      ${llama}
      ${default_llama_args}
      -hf unsloth/gemma-4-E4B-it-GGUF:Q5_K_M
  "Qwen3.8-27B":
    macros:
      "default_ctx": 64000
    proxy: "${model-url}"
    cmd: >
      ${llama}
      ${default_llama_args}
      --chat-template-kwargs '{"reasoning_effort":"low"}'
      --jinja
      --temp 0.7
      --top_p 0.95
      --top_k 20
      --min_p 0.0
      --presence_penalty 0.0
      --repeat_penalty 1.0
      --n-gpu-layers 999
      --no-mmproj-offload
      --spec-type draft-mtp --spec-draft-n-max 1
      -hf ISTA-DASLab/Qwen3.8-27B-GSQ-RCO-GGUF:IQ3_S
  "Qwen3.8-Flash":
    proxy: "${model-url}"
# You can set higher ttl for strata, since it takes longer to load and warmup
    ttl: 7200
# This env is required to let Strata allow llama-swap host name, replace with your own host name or fqdn
# or leave it to wildcard (Stata should bind to localhost)
    env:
      - "STRATA_ALLOWED_HOSTS=*"
    cmd: >
      ${strata}
      --config /root/data/Strata/strata-iq3_s.json
  # For stable-diffusion, offload-to-cpu is generally a good option
  # if you are generating bigger images (1024 or above)
  # otherwise this may crash or produce blank images, depending if you have enough vram
  # This may have a small performance impact
  "Z-Image-Turbo":
    proxy: "${model-url}"
    checkEndpoint: /
    cmd: >
      ${sd}
      --offload-to-cpu
      --diffusion-model ${sd_models_dir}/z_image_turbo-Q6_K.gguf
      --vae ${sd_models_dir}/flux1-dev.ae.safetensors
      --llm ${sd_models_dir}/Qwen3-4B-2507-Instruct-Uncensored-HauhauCS-Aggressive-Q6_K.gguf
      --diffusion-fa
      --cfg-scale 1.0
  "Z-Image":
    proxy: "${model-url}"
    checkEndpoint: /
    cmd: >
      ${sd}
      --offload-to-cpu
      --diffusion-model ${sd_models_dir}/z-image-Q6_K.gguf
      --vae ${sd_models_dir}/flux1-dev.ae.safetensors
      --llm ${sd_models_dir}/Qwen3-4B-2507-Instruct-Uncensored-HauhauCS-Aggressive-Q6_K.gguf
      --diffusion-fa
      --cfg-scale 5.0
  "Chroma":
    proxy: "${model-url}"
    checkEndpoint: /
    cmd: >
      ${sd}
      --offload-to-cpu
      --diffusion-model  ${sd_models_dir}/chroma-unlocked-v50-Q5_0.gguf
      --vae ${sd_models_dir}/flux1-dev.ae.safetensors
      --t5xxl ${sd_models_dir}/t5xxl-Q5_0.gguf
      --sampling-method euler
      --cfg-scale 4.0
#      --chroma-disable-dit-mask # Although it is documented to use this, it crashes with "buffer not set" error when generating an image

# Kokoro TTS: OpenAI compatible /v1/audio/speech, see the Kokoro-FastAPI project.
# It runs on CPU only, and hold roughly 0.5GB of system RAM while loaded.
# Its first start downloads the 327MB voice model into ~/data/kokoro-model (data
# volume), that is why healthCheckTimeout has to stay generous.
# useModelName is required: llama-swap rewrites the "model" field of the request
# to that value, and kokoro only accepts tts-1, tts-1-hd, kokoro, gpt-4o-mini-tts.
# Add this model to persistent-group below if you want it always ready.
#
# Three ways to reach it, all on llama-swap's own port (8080 here):
#   POST /v1/audio/speech       with "model": "kokoro-tts" (or tts-1 / tts-1-hd
#                               below) - the normal OpenAI route, this is what
#                               clients should use
#   GET  /v1/audio/voices?model=kokoro-tts - the voice list, proxied to kokoro
#   GET  /upstream/kokoro-tts/  - kokoro's own web player UI (llama-swap's "open
#                               engine UI" button); it lands on /web/ through the
#                               redirect our kokoro-server launcher adds. The
#                               /upstream/ path is for that UI only: it bypasses
#                               llama-swap's model routing, do not point clients
#                               at /upstream/kokoro-tts/v1 if /v1 works.
  "kokoro-tts":
    name: "Kokoro TTS"
    useModelName: "tts-1"
    proxy: "${model-url}"
    checkEndpoint: "/health"
    # so OpenAI clients that hardcode an OpenAI TTS name still get here, and
    # /v1/models advertises this as a text->audio model (drop them if you have
    # another engine that should own those names; set includeAliasesInList: true
    # at the top level to also list the aliases themselves in /v1/models)
    aliases:
      - "tts-1"
      - "tts-1-hd"
    capabilities:
      in: ["text"]
      out: ["audio"]
      # voices stays unset on purpose: llama-swap then proxies /v1/audio/voices
      # to kokoro and the list always matches the installed voices
    # llama-swap's default limit is 10 parallel requests and the excess get HTTP
    # 429 with a JSON body - the web ui fetches 20+ ES modules at once, so the
    # browser reports "NS_ERROR_CORRUPTED_CONTENT" / "disallowed MIME type
    # (application/json)" and the page half-loads (no text editor, no voices).
    # Same reason llama-swap's own docs raise the limit for web-app engines.
    concurrencyLimit: 999
    cmd: >
      ${kokoro}
    # KOKORO_DATA_DIR is where the weights are kept, API_LOG_LEVEL quiets the
    # upstream logs. Any Kokoro-FastAPI setting can be set here.
    # KOKORO_ROOT_REDIRECT=false drops our ASGI wrapper and runs upstream's app
    # as-is (its engine UI button then 404s and the player loses its voice list
    # behind /upstream/). KOKORO_ROOT_PATH=/some/prefix forces the prefix the
    # player is told about, if you reverse-proxy it somewhere else.
    env:
      - "KOKORO_DATA_DIR=${env.HOME}/data/kokoro-model"
      - "API_LOG_LEVEL=INFO"

# These models are configured to use "CPU" and normal RAM, instad of GPU and vram
# so we can load them concurrently with other large models using the GPU
# If you have multiple GPUs, of more vram, you can tune this the way you want,
# this is only an example
groups:
  "persistent-group":
    swap: false
    exclusive: false
    persistent: true
    members:
      - "qwen2.5-coder-1.5b-base"
      - "kokoro-tts"
